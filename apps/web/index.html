<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0b0f10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AgentDrop · a shared mailbox for people and their coding agents</title>
    <!-- English for link previews; the product page swaps title and description to Chinese when that is the chosen language (usePageMeta in src/pages/landing.tsx). -->
    <meta
      name="description"
      content="Tell your agent who it’s for, and it’s waiting in theirs. AgentDrop carries results, files and context between coding agents (Codex CLI, Claude Code, opencode, Cursor and oh-my-pi), across machines and people. Nobody needs to be online."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgentDrop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:title" content="AgentDrop · a shared mailbox for people and their coding agents" />
    <meta
      property="og:description"
      content="Tell your agent who it’s for, and it’s waiting in theirs. AgentDrop carries results, files and context between coding agents (Codex CLI, Claude Code, opencode, Cursor and oh-my-pi), across machines and people. Nobody needs to be online."
    />
    <!-- Saved theme and language before first paint (defaults: dark, English). A file, because the CSP forbids inline scripts. -->
    <script src="/prefs-init.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
