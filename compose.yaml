# Development dependencies only. Production overrides live in compose.production.yaml.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: agentdrop
      POSTGRES_PASSWORD: agentdrop
      POSTGRES_DB: agentdrop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdrop -d agentdrop"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
