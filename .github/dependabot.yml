# Weekly, grouped dependency updates. Every dependency is pinned exactly and every action by commit SHA, so nothing
# moves without a reviewed PR; this keeps those pins from going stale. A 7-day cooldown lets the ecosystem catch a
# compromised or broken release before it reaches us. Security updates are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: npm # also covers the pnpm workspace and pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node majors are chosen by hand and only ever an even-numbered LTS line (odd majors are never LTS).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
