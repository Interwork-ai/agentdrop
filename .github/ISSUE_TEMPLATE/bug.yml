name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Leave out real credentials, server addresses and other people's names or messages; use placeholders such as
        `drop.example.com` and Alice/Bob. Security issues go through private reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. agentdrop setup --server https://drop.example.com\n2. …"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`agentdrop --version`, the server version (shown in the dashboard footer or /health/live), Node.js."
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Agent client
      multiple: true
      options: [Codex CLI, Claude Code, opencode, Cursor, oh-my-pi, WorkBuddy, Dashboard only, Not client-related]
  - type: textarea
    id: logs
    attributes:
      label: "Output of `agentdrop doctor` or relevant logs (redacted)"
      render: text
